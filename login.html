<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EduManage Student System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f4f7fb;
      color: #0f172a;
    }
    .kpi-icon {
      background: linear-gradient(135deg, #2563eb 0%, #0ea5e9 100%);
    }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4 antialiased">
  <div class="w-full max-w-md rounded-2xl border border-slate-200/80 bg-white p-8 shadow-lg">
    <div class="flex flex-col items-center text-center">
      <div class="kpi-icon flex h-12 w-12 items-center justify-center rounded-2xl text-white shadow-md">
        <i data-lucide="graduation-cap" class="h-6 w-6"></i>
      </div>
      <h1 class="mt-4 text-xl font-bold tracking-tight text-slate-900">EduManage</h1>
      <p class="mt-1 text-xs text-slate-500">Sign in to access the Student Management System</p>
    </div>

    <form id="loginForm" class="mt-6 space-y-4">
      <div>
        <label for="loginUsername" class="block text-xs font-semibold text-slate-600">Username</label>
        <div class="relative mt-1">
          <i data-lucide="user" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
          <input
            id="loginUsername"
            type="text"
            required
            placeholder="Enter username"
            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 py-2.5 pl-10 pr-3.5 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15"
          />
        </div>
      </div>

      <div>
        <label for="loginPassword" class="block text-xs font-semibold text-slate-600">Password</label>
        <div class="relative mt-1">
          <i data-lucide="lock" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
          <input
            id="loginPassword"
            type="password"
            required
            placeholder="Enter password"
            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 py-2.5 pl-10 pr-10 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15"
          />
          <button
            type="button"
            id="togglePasswordBtn"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
            aria-label="Toggle password visibility"
          >
            <i data-lucide="eye" class="h-4 w-4"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex cursor-pointer items-center gap-2 text-slate-600">
          <input id="rememberMeCheck" type="checkbox" checked class="h-3.5 w-3.5 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
          <span>Keep me signed in</span>
        </label>
        <button type="button" id="fillDemoBtn" class="font-semibold text-blue-600 hover:text-blue-700">
          Use demo credentials
        </button>
      </div>

      <p id="loginError" class="hidden rounded-xl bg-rose-50 px-3.5 py-2 text-xs font-medium text-rose-600"></p>

      <button
        type="submit"
        class="w-full rounded-full bg-gradient-to-r from-blue-600 to-sky-500 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-95"
      >
        Sign In
      </button>
    </form>

    <div class="mt-5 rounded-xl border border-blue-100 bg-blue-50/60 p-3 text-center text-xs text-slate-600">
      Demo Credentials &mdash; Username: <strong class="text-slate-900">admin</strong> &bull; Password: <strong class="text-slate-900">admin123</strong>
    </div>
  </div>

  <script>
    const AUTH_KEY = 'edumanage_auth_v1';
    const VALID_CREDENTIALS = {
      admin: 'admin123',
      sara: 'edumanage',
    };

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      document.getElementById('togglePasswordBtn').addEventListener('click', () => {
        const pwd = document.getElementById('loginPassword');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('fillDemoBtn').addEventListener('click', () => {
        document.getElementById('loginUsername').value = 'admin';
        document.getElementById('loginPassword').value = 'admin123';
        document.getElementById('loginError').classList.add('hidden');
      });

      document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        const user = document.getElementById('loginUsername').value.trim().toLowerCase();
        const pass = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');

        if (!VALID_CREDENTIALS[user] || VALID_CREDENTIALS[user] !== pass) {
          err.textContent = 'Invalid username or password. Try admin / admin123.';
          err.classList.remove('hidden');
          return;
        }

        err.classList.add('hidden');
        if (document.getElementById('rememberMeCheck').checked) {
          try {
            localStorage.setItem(AUTH_KEY, user);
          } catch (ex) {}
        }
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
